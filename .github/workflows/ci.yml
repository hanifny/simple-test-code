name: CI/CD Notes App Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Job Lint
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  # 2. Job Unit Test
  unit-test:
    name: Unit Testing
    needs: lint # Berjalan hanya jika lint berhasil
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run Tests with Coverage
        # Menampilkan coverage
        run: npm test -- --coverage

      # Upload hasil coverage agar bisa dibaca job SonarQube
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # 3. Job SonarQube Scan untuk analisis kualitas kode
  sonarqube:
    name: SonarQube Analysis
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # 4. Job k6 Smoke Test
  k6-test:
    name: k6 Smoke Test
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install
        run: npm install
      - name: Run App & k6
        run: |
          npm start &
          sleep 10
          curl -v http://localhost:3000 || true
          npx k6 run loadtest/script.js --env BASE_URL=http://localhost:3000
